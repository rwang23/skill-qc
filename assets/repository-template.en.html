<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__REPORT_TITLE__</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #ebe8df;
      --paper: #f8f6ef;
      --ink: #151914;
      --muted: #687068;
      --line: #cdd1c8;
      --acid: #d8ff45;
      --green: #164a38;
      --orange: #ee6945;
      --amber: #d7a329;
      --red: #a83b34;
      --shadow: 0 22px 70px rgba(21, 25, 20, .11);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 86% 7%, rgba(216, 255, 69, .52), transparent 23rem),
        linear-gradient(rgba(21, 25, 20, .045) 1px, transparent 1px),
        var(--canvas);
      background-size: auto, 100% 28px, auto;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .repository-page { min-height: 100vh; }
    .shell { width: min(1240px, calc(100% - 40px)); margin: 0 auto; }
    .masthead {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(21, 25, 20, .22);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: -.04em; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; color: var(--acid); background: var(--ink); border-radius: 4px 16px 4px 4px; font: 800 13px/1 "Trebuchet MS", sans-serif; }
    .mast-meta { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      gap: 56px;
      align-items: end;
      padding: 72px 0 54px;
    }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 22px; max-width: 850px; font: 500 clamp(54px, 8vw, 104px)/.86 "Palatino Linotype", Georgia, serif; letter-spacing: -.065em; }
    .hero-copy { max-width: 720px; margin-bottom: 0; color: var(--muted); font-size: 18px; }
    .score-block { position: relative; min-height: 300px; padding: 34px; overflow: hidden; color: white; background: var(--ink); border-radius: 4px 44px 4px 4px; box-shadow: var(--shadow); }
    .score-block::after { content: ""; position: absolute; width: 180px; height: 180px; right: -55px; top: -55px; background: var(--acid); border-radius: 50%; }
    .score-label { position: relative; z-index: 1; color: #bfc8be; font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
    .score-value { position: relative; z-index: 1; margin-top: 32px; font: 500 112px/.75 "Palatino Linotype", Georgia, serif; letter-spacing: -.09em; }
    .score-value small { color: #bfc8be; font: 13px/1 "Trebuchet MS", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .score-note { position: relative; z-index: 1; margin: 28px 0 0; max-width: 250px; color: #cdd3cc; font-size: 13px; }

    .signal-grid { display: grid; grid-template-columns: 1.15fr .85fr .85fr .85fr; gap: 12px; margin: 0 0 92px; }
    .signal { padding: 20px 22px; background: rgba(248, 246, 239, .74); border: 1px solid var(--line); }
    .signal:first-child { border-left: 7px solid var(--acid); }
    .signal-kicker { color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
    .signal-value { margin-top: 7px; font: 500 27px/1 "Palatino Linotype", Georgia, serif; }
    .signal-note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }

    section { padding-bottom: 92px; }
    .section-head { display: grid; grid-template-columns: 150px .9fr 1.1fr; gap: 30px; align-items: end; margin-bottom: 30px; }
    .section-index { color: var(--orange); font: 500 52px/1 "Palatino Linotype", Georgia, serif; }
    h2 { margin-bottom: 0; font: 500 clamp(34px, 4.6vw, 60px)/.95 "Palatino Linotype", Georgia, serif; letter-spacing: -.045em; }
    .section-intro { margin-bottom: 2px; color: var(--muted); font-size: 16px; }

    .dimension-grid { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
    .dimension-card { min-height: 218px; padding: 22px; background: var(--paper); border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
    .dimension-name { min-height: 45px; font-weight: 900; }
    .dimension-score { margin-top: 22px; font: 500 48px/1 "Palatino Linotype", Georgia, serif; letter-spacing: -.04em; }
    .dimension-score small { color: var(--muted); font: 11px/1 "Trebuchet MS", sans-serif; }
    .bar { height: 9px; margin-top: 17px; overflow: hidden; background: #dfe1da; border-radius: 99px; }
    .bar span { display: block; width: var(--percent); height: 100%; background: var(--green); border-radius: inherit; }
    .dimension-foot { margin-top: 11px; color: var(--muted); font-size: 11px; }

    .distribution { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .distribution-panel { padding: 28px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(21, 25, 20, .04); }
    .panel-title { margin-bottom: 22px; font: 500 26px/1 "Palatino Linotype", Georgia, serif; }
    .stack { display: flex; height: 42px; overflow: hidden; background: #dfe1da; }
    .stack span { min-width: 2px; }
    .stack .pass { background: var(--green); }
    .stack .review { background: var(--amber); }
    .stack .blocked { background: var(--red); }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 17px; color: var(--muted); font-size: 12px; }
    .legend strong { color: var(--ink); }
    .evidence-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .evidence-chip { padding: 14px 12px; text-align: center; background: #e8e8df; }
    .evidence-chip strong { display: block; font: 500 27px/1 "Palatino Linotype", Georgia, serif; }
    .evidence-chip span { color: #4d554d; font-size: 11px; }

    .ledger { border-top: 1px solid var(--ink); }
    .ledger-row { display: grid; grid-template-columns: 68px minmax(190px, 1fr) 90px 105px 105px; gap: 16px; align-items: center; min-height: 74px; padding: 12px 8px; border-bottom: 1px solid var(--line); }
    .ledger-row.header { min-height: 45px; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
    .rank { color: var(--orange); font: 500 24px/1 "Palatino Linotype", Georgia, serif; }
    .skill-name { font-weight: 900; word-break: break-word; }
    .skill-score { font: 500 28px/1 "Palatino Linotype", Georgia, serif; }
    .gate { width: fit-content; padding: 6px 9px; border: 1px solid currentColor; font-size: 10px; font-weight: 900; letter-spacing: .08em; }
    .gate.pass { color: var(--green); }
    .gate.review { color: #8b6400; }
    .gate.blocked { color: var(--red); }
    .evidence { color: var(--muted); font-size: 12px; }

    .priority-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .priority-card { min-height: 184px; padding: 22px; background: var(--ink); color: white; }
    .priority-count { color: var(--acid); font: 500 42px/1 "Palatino Linotype", Georgia, serif; }
    .priority-code { margin-top: 18px; font: 12px/1.4 "Cascadia Mono", Consolas, monospace; color: #dfe6de; word-break: break-word; }
    .priority-note { margin: 10px 0 0; color: #b9c3ba; font-size: 12px; }
    .empty { padding: 40px; color: var(--green); background: rgba(216, 255, 69, .32); border: 1px dashed var(--green); text-align: center; }

    .method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .method-card { padding: 25px; background: var(--paper); border-top: 5px solid var(--ink); }
    .method-card strong { display: block; margin-bottom: 12px; font: 500 24px/1.05 "Palatino Linotype", Georgia, serif; }
    .method-card p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    footer { padding: 25px 0 44px; border-top: 1px solid rgba(21, 25, 20, .25); color: var(--muted); font-size: 11px; }
    .footer-row { display: flex; justify-content: space-between; gap: 20px; }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .score-block { max-width: 470px; }
      .signal-grid { grid-template-columns: repeat(2, 1fr); }
      .section-head { grid-template-columns: 90px 1fr; }
      .section-intro { grid-column: 2; }
      .dimension-grid { grid-template-columns: repeat(2, 1fr); }
      .distribution, .method-grid { grid-template-columns: 1fr; }
      .priority-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 620px) {
      .shell { width: min(100% - 24px, 1240px); }
      .mast-meta { display: none; }
      .hero { padding-top: 48px; }
      h1 { font-size: 55px; }
      .signal-grid, .dimension-grid, .priority-grid { grid-template-columns: 1fr; }
      .section-head { grid-template-columns: 1fr; }
      .section-intro { grid-column: 1; }
      .ledger-row { grid-template-columns: 44px 1fr 64px; }
      .ledger-row > :nth-child(4), .ledger-row > :nth-child(5) { grid-column: 2; }
      .ledger-row.header { display: none; }
      .footer-row { display: block; }
    }
    @media print {
      body { background: white; }
      .shell { width: 100%; max-width: none; }
      .score-block, .distribution-panel, .priority-card, .method-card { break-inside: avoid; box-shadow: none; }
      section { padding-bottom: 48px; }
    }
  </style>
</head>
<body>
  <main class="repository-page" id="app"></main>
  <script>
    const report = __AUDIT_DATA__;
    const summary = report.summary;
    const dimensions = report.dimensions;
    const skills = [...report.skills].sort((a, b) => b.quality_score - a.quality_score || a.name.localeCompare(b.name));
    const generatedAt = "__GENERATED_AT__";
    const labels = {
      routing: "Routing", executability: "Executability", context: "Context efficiency",
      resources: "Resource design", safety: "Safety", portability: "Portability",
      effectiveness: "Effectiveness readiness", maintainability: "Maintainability"
    };
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const percentage = (count) => summary.skill_count ? (count / summary.skill_count) * 100 : 0;

    const evidenceCounts = {E1: 0, E2: 0, E3: 0, E4: 0};
    const findingCounts = new Map();
    skills.forEach((skill) => {
      evidenceCounts[skill.evidence.grade] = (evidenceCounts[skill.evidence.grade] || 0) + 1;
      skill.findings.forEach((finding) => findingCounts.set(finding.code, (findingCounts.get(finding.code) || 0) + 1));
    });
    const priorities = [...findingCounts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 6);
    const gateClass = (gate) => String(gate).toLowerCase();

    const dimensionCards = dimensions.map((item) => `
      <article class="dimension-card">
        <div class="dimension-name">${escapeHtml(labels[item.id] || item.id)}</div>
        <div class="dimension-score">${item.average_score}<small> / ${item.weight} avg</small></div>
        <div class="bar" role="progressbar" aria-label="${escapeHtml(labels[item.id] || item.id)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${item.average_percent}"><span style="--percent:${item.average_percent}%"></span></div>
        <div class="dimension-foot">${item.full_score_count} of ${item.skill_count} Skills earned full points</div>
      </article>`).join("");

    const ledgerRows = skills.map((skill, index) => `
      <article class="ledger-row">
        <div class="rank">${String(index + 1).padStart(2, "0")}</div>
        <div class="skill-name">${escapeHtml(skill.name)}</div>
        <div class="skill-score">${skill.quality_score}</div>
        <div><span class="gate ${gateClass(skill.gate_status)}">${escapeHtml(skill.gate_status)}</span></div>
        <div class="evidence">${escapeHtml(skill.evidence.grade)} evidence</div>
      </article>`).join("");

    const priorityCards = priorities.length ? priorities.map(([code, count]) => `
      <article class="priority-card">
        <div class="priority-count">${count}</div>
        <div class="priority-code">${escapeHtml(code)}</div>
        <p class="priority-note">Detected in ${count} of ${summary.skill_count} audited Skills.</p>
      </article>`).join("") : `<div class="empty">No scored finding recurred across the audited Skills.</div>`;

    document.getElementById("app").innerHTML = `
      <div class="shell">
        <header class="masthead"><div class="brand"><span class="brand-mark">QC</span>SkillQC</div><div class="mast-meta">Repository audit · Rubric ${escapeHtml(report.rubric_version)}</div></header>

        <section class="hero">
          <div><div class="eyebrow">Repository Quality Report</div><h1>A portfolio, read as evidence.</h1><p class="hero-copy">SkillQC audited ${summary.skill_count} discoverable Agent Skills under one rubric. The average describes package engineering quality. It does not judge the business expertise or domain results of the capabilities those Skills perform.</p></div>
          <div class="score-block"><div class="score-label">Average Skill Score</div><div class="score-value">${summary.average_quality_score}<small> / 100</small></div><p class="score-note">An unweighted mean across Skills. Safety gates remain separate and cannot be averaged away.</p></div>
        </section>

        <div class="signal-grid">
          <article class="signal"><div class="signal-kicker">Skills discovered</div><div class="signal-value">${summary.skill_count}</div><p class="signal-note">One score per discoverable Skill package.</p></article>
          <article class="signal"><div class="signal-kicker">Pass</div><div class="signal-value">${summary.gate_counts.PASS}</div><p class="signal-note">No blocker or high finding detected.</p></article>
          <article class="signal"><div class="signal-kicker">Review</div><div class="signal-value">${summary.gate_counts.REVIEW}</div><p class="signal-note">Human adjudication required.</p></article>
          <article class="signal"><div class="signal-kicker">Blocked</div><div class="signal-value">${summary.gate_counts.BLOCKED}</div><p class="signal-note">Non-compensable risk detected.</p></article>
        </div>

        <section>
          <div class="section-head"><div class="section-index">01</div><h2>Eight dimensions, averaged.</h2><p class="section-intro">Each bar is the mean earned score for that dimension. Full-score counts show whether the average is broadly shared or carried by a few strong packages.</p></div>
          <div class="dimension-grid">${dimensionCards}</div>
        </section>

        <section>
          <div class="section-head"><div class="section-index">02</div><h2>Risk and proof stay visible.</h2><p class="section-intro">A high average cannot erase a blocked Skill. Evidence grades also remain separate from package quality.</p></div>
          <div class="distribution">
            <article class="distribution-panel"><div class="panel-title">Safety gate distribution</div><div class="stack" role="img" aria-label="Safety gate distribution"><span class="pass" style="width:${percentage(summary.gate_counts.PASS)}%"></span><span class="review" style="width:${percentage(summary.gate_counts.REVIEW)}%"></span><span class="blocked" style="width:${percentage(summary.gate_counts.BLOCKED)}%"></span></div><div class="legend"><span><strong>${summary.gate_counts.PASS}</strong> pass</span><span><strong>${summary.gate_counts.REVIEW}</strong> review</span><span><strong>${summary.gate_counts.BLOCKED}</strong> blocked</span></div></article>
            <article class="distribution-panel"><div class="panel-title">Evidence distribution</div><div class="evidence-list">${Object.entries(evidenceCounts).map(([grade, count]) => `<div class="evidence-chip"><strong>${count}</strong><span>${grade}</span></div>`).join("")}</div><div class="legend"><span>E1 static</span><span>E2 fixtures</span><span>E3 client trace</span><span>E4 operating trace</span></div></article>
          </div>
        </section>

        <section>
          <div class="section-head"><div class="section-index">03</div><h2>The Skill ledger.</h2><p class="section-intro">The repository average is only a summary. This ledger preserves each Skill's score, gate, and evidence grade.</p></div>
          <div class="ledger"><div class="ledger-row header"><div>Rank</div><div>Skill</div><div>Score</div><div>Gate</div><div>Evidence</div></div>${ledgerRows}</div>
        </section>

        <section>
          <div class="section-head"><div class="section-index">04</div><h2>Recurring improvement signals.</h2><p class="section-intro">Frequency helps prioritize shared packaging work. It does not make a heuristic finding automatically correct.</p></div>
          <div class="priority-grid">${priorityCards}</div>
        </section>

        <section>
          <div class="section-head"><div class="section-index">05</div><h2>How to read this report.</h2><p class="section-intro">The repository report summarizes the same read-only checks used for a single Skill. It does not execute target code or measure business outcomes.</p></div>
          <div class="method-grid">
            <article class="method-card"><strong>Average, not certification</strong><p>${summary.average_quality_score}/100 is the arithmetic mean of ${summary.skill_count} artifact scores under rubric ${escapeHtml(report.rubric_version)}.</p></article>
            <article class="method-card"><strong>Gate, not a deduction</strong><p>The repository status is ${escapeHtml(summary.gate_status)} because any blocked or review Skill remains visible outside the average.</p></article>
            <article class="method-card"><strong>Skill quality, not business depth</strong><p>SkillQC evaluates routing, execution design, context, resources, safety, portability, verification readiness, and maintainability.</p></article>
          </div>
        </section>

        <footer><div class="footer-row"><span>Generated by SkillQC · ${escapeHtml(generatedAt)}</span><span>${summary.skill_count} Skills · read-only repository audit</span></div></footer>
      </div>`;
  </script>
</body>
</html>
